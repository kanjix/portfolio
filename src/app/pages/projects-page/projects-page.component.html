<section class="section">
  <div class="section-header">
    <h2>Проектная деятельность</h2>
    <p>Визуализация идей и проектирование пространств: от разработки архитектурных объемов до создания качественной жилой и общественной среды.</p>
  </div>

  <div *ngIf="isLoading()" class="loading">Загрузка...</div>

  <ng-container *ngIf="!isLoading()">
    <div *ngFor="let group of categories()" class="category-group">
      <h3 class="category-title">{{ group.name }}</h3>
      <div class="projects-grid">
        <app-project-card
          *ngFor="let project of group.items"
          [project]="project"
          (open)="selectedProject.set($event)"
        ></app-project-card>
      </div>
    </div>
  </ng-container>

  <app-project-modal
    *ngIf="selectedProject()"
    [project]="selectedProject()"
    (close)="selectedProject.set(undefined)"
  ></app-project-modal>
</section>
